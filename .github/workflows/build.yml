name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  OPENCV_VERSION: 4.9.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git pkg-config \
            libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev \
            libv4l-dev libjpeg-dev libpng-dev libtiff-dev

      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: opencv-install
          key: opencv-${{ env.OPENCV_VERSION }}-v2-${{ runner.os }}

      - name: Build OpenCV ${{ env.OPENCV_VERSION }} (with contrib/aruco)
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          git clone --branch ${OPENCV_VERSION} --depth 1 https://github.com/opencv/opencv.git
          git clone --branch ${OPENCV_VERSION} --depth 1 https://github.com/opencv/opencv_contrib.git
          cmake -S opencv -B opencv-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/opencv-install" \
            -DOPENCV_EXTRA_MODULES_PATH="${GITHUB_WORKSPACE}/opencv_contrib/modules" \
            -DBUILD_LIST=core,imgproc,imgcodecs,highgui,videoio,video,calib3d,objdetect,aruco \
            -DBUILD_opencv_python2=OFF -DBUILD_opencv_python3=OFF \
            -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF -DBUILD_EXAMPLES=OFF -DBUILD_DOCS=OFF
          cmake --build opencv-build -j"$(nproc)"
          cmake --install opencv-build

      - name: Configure project
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DOpenCV_DIR="${GITHUB_WORKSPACE}/opencv-install/lib/cmake/opencv4"

      - name: Build project
        run: cmake --build build -j"$(nproc)"
